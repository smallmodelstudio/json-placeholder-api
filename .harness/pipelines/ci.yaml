pipeline:
  name: CI
  identifier: json_placeholder_api_ci
  projectIdentifier: json_placeholder_api
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.REPLACE_WITH_REAL_GITHUB_CONNECTOR
        build: <+input>
  stages:
    - stage:
        name: Build and test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          # Cloud runner keeps this inside the free 2,000 credits/month tier.
          # Swap to a self-hosted runner connector once
          # that budget is a real constraint — the steps below don't change.
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install dependencies
                  identifier: install_deps
                  spec:
                    shell: Sh
                    command: npm ci

              # Mirrors the three independent checks that gate local work
              # (npm run lint / typecheck / test) — run in parallel since
              # none of them depend on each other's output.
              - parallel:
                  - step:
                      type: Run
                      name: Lint
                      identifier: lint
                      spec:
                        shell: Sh
                        # lint:check (no --fix) so a formatting problem fails
                        # the build instead of being silently rewritten and
                        # passing anyway.
                        command: npm run lint:check
                  - step:
                      type: Run
                      name: Typecheck
                      identifier: typecheck
                      spec:
                        shell: Sh
                        command: npm run typecheck
                  - step:
                      type: Run
                      name: Unit tests
                      identifier: unit_tests
                      spec:
                        shell: Sh
                        command: npm run test

              - step:
                  type: Run
                  name: E2E tests
                  identifier: e2e_tests
                  spec:
                    shell: Sh
                    # Nock-mocked (docs/README-testing.md) — never touches the real
                    # network, so this is safe to run on every PR. Contract
                    # tests hit the real upstream and are deliberately kept
                    # out of this pipeline; see contract-tests.yaml.
                    command: npm run test:e2e

              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and push image
                  identifier: build_and_push
                  spec:
                    connectorRef: account.REPLACE_WITH_REAL_REGISTRY_CONNECTOR
                    repo: REPLACE_WITH_REAL_REGISTRY/json-placeholder-api
                    dockerfile: Dockerfile
                    tags:
                      - <+codebase.shortCommitSha>
                      - latest
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "branch" && <+codebase.branch> == "master"

              - step:
                  type: Run
                  name: Promote image tag to overlays
                  identifier: promote_overlays
                  spec:
                    shell: Sh
                    # GitOps-style promotion: CI writes the tag it just built
                    # into the overlays that CD reads, rather than Harness
                    # substituting an artifact into the Kustomize manifest at
                    # deploy time. Chosen over Harness's manifest/artifact
                    # coupling for Kustomize because that path is unverified
                    # against a real tenant (see docs/README-harness.md) — this
                    # way CD only ever applies exactly what's committed.
                    #
                    # Both overlays get the exact tag "Build and push image"
                    # just pushed to REPLACE_WITH_REAL_REGISTRY — previously
                    # this only touched the local overlay, and pointed it at
                    # k3d-jsonplaceholder-registry:5000, a registry nothing
                    # was ever pushed to (that hostname only resolves inside a
                    # local k3d cluster's own network, not from this runner).
                    # The prod overlay was never touched at all, so
                    # "Deploy to prod" would apply whatever k8s/overlays/prod
                    # had committed — REPLACE_WITH_REAL_TAG, forever. Now the
                    # same commit promotes both, so the manual-approval gate
                    # in cd.yaml is the only thing standing between a change
                    # and prod, not a stale manifest.
                    command: |
                      set -euo pipefail
                      for overlay in local prod; do
                        (cd "k8s/overlays/${overlay}" && npx kustomize edit set image \
                          json-placeholder-api=REPLACE_WITH_REAL_REGISTRY/json-placeholder-api:<+codebase.shortCommitSha>)
                      done
                      git config user.name "harness-ci"
                      git config user.email "ci@REPLACE_WITH_REAL_DOMAIN"
                      git add k8s/overlays/local/kustomization.yaml k8s/overlays/prod/kustomization.yaml
                      git commit -m "chore(deploy): promote json-placeholder-api to <+codebase.shortCommitSha>"
                      git push origin HEAD:<+codebase.branch>
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "branch" && <+codebase.branch> == "master"
