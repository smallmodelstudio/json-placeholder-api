pipeline:
  name: CD
  identifier: json_placeholder_api_cd
  projectIdentifier: json_placeholder_api
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Deploy to local k3d
        identifier: deploy_local_k3d
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: json_placeholder_api
          environment:
            environmentRef: local_k3d
            infrastructureDefinitions:
              - identifier: local_k3d_infra
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling deploy
                  identifier: rolling_deploy
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  type: ShellScript
                  name: Smoke test
                  identifier: smoke_test
                  spec:
                    shell: Bash
                    onDelegate: true
                    # Deliberately just a smoke test, not "Harness native
                    # health gating" in the fuller sense PLAN.md's Phase 7
                    # points at — that wants real metrics to gate on, which
                    # don't exist until Phase 8's OTel work lands. This is
                    # the honest interim version: the same curls Phase 6
                    # verified by hand, now automated and blocking rollout.
                    #
                    # Hits the in-cluster Service directly, not the
                    # host-mapped Traefik port (localhost:8080) Phase 6's
                    # README uses — this script runs on the Delegate, which
                    # is itself a pod inside the k3d cluster (see
                    # .harness/README.md), so it shares the cluster network
                    # and localhost:8080 wouldn't resolve to anything.
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          curl -sf http://json-placeholder-api.default.svc.cluster.local/health/ready
                          curl -sf http://json-placeholder-api.default.svc.cluster.local/posts/1 > /dev/null
                    executionTarget: {}
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback
                  identifier: rollback

    - stage:
        name: Promote to prod?
        identifier: promote_to_prod_approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Manual approval
                  identifier: manual_approval
                  spec:
                    approvalMessage: |
                      json-placeholder-api passed CI and the local k3d smoke
                      test. Approve to roll it out to prod.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account.REPLACE_WITH_REAL_USER_GROUP
                      minimumCount: 1
                    isAutoRejectEnabled: true
                    approverInputs: []

    - stage:
        name: Deploy to prod
        identifier: deploy_prod
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: json_placeholder_api
          environment:
            environmentRef: prod
            infrastructureDefinitions:
              - identifier: prod_infra
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling deploy
                  identifier: rolling_deploy
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  type: ShellScript
                  name: Smoke test
                  identifier: smoke_test
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          curl -sf -H 'Host: REPLACE_WITH_REAL_HOST' https://REPLACE_WITH_REAL_HOST/health/ready
                    executionTarget: {}
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback
                  identifier: rollback
