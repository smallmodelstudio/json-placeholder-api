service:
  name: json-placeholder-api
  identifier: json_placeholder_api
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: k8s_manifests
            type: Kustomize
            spec:
              store:
                type: Github
                spec:
                  connectorRef: account.github_connector
                  gitFetchType: Branch
                  branch: master
                  # One overlay path per environment (k8s/base +
                  # overlays/{local,prod}); the environment supplies which
                  # folder via its own `overlay` variable, kept as a single
                  # source of truth rather than duplicating this manifest
                  # block per environment.
                  folderPath: k8s/overlays/<+env.variables.overlay>
              pluginPath: kustomize
  gitOpsEnabled: false
