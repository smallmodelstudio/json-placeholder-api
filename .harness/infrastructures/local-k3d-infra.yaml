infrastructureDefinition:
  name: local-k3d-infra
  identifier: local_k3d_infra
  orgIdentifier: default
  projectIdentifier: json_placeholder_api
  environmentRef: local_k3d
  deploymentType: Kubernetes
  type: KubernetesDirect
  spec:
    # The Kubernetes connector should use "Inherit from Delegate" against the
    # Delegate installed into this same k3d cluster (see docs/README-harness.md)
    # — Harness never needs inbound access to the cluster, only an
    # outbound-only Delegate already running inside it.
    connectorRef: account.REPLACE_WITH_REAL_K8S_CONNECTOR
    namespace: default
    releaseName: json-placeholder-api
  allowSimultaneousDeployments: false
